# Local edge NATS leaf node for Avena RS boxes.
#
# Generated by shared/render-edge-config.py from shared/edge-box.config.json.
# Re-render that profile for box-specific changes.


server_name: "i69-mu2-leaf"
listen: "127.0.0.1:4222"
http: "127.0.0.1:8222"

jetstream {
  store_dir: "/var/lib/nats/jetstream"
  domain: "edge-i69-mu2"
  # Flush every write to disk. Without it nats-server renames consumer state
  # files without an fsync, and a power cut can leave them empty, which makes
  # the archiver's consumers start again from the beginning of the stream.
  sync_interval: always
}

leafnodes {
  remotes = [
    {
      urls: [
        "nats://nats1.oats:7422"
        "nats://nats2.oats:7422"
      ]
      credentials: "/etc/nats/creds/leaf.creds"
    }
  ]
}
