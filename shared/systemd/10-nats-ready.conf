# Drop-in for avena-streamer, avena-archiver and avena-exporter, installed as
# /etc/systemd/system/<unit>.service.d/10-nats-ready.conf by
# scripts/install-edge-services.sh.
#
# Waits for local NATS JetStream before the service starts. The wait can take up
# to 600 s, so the start timeout is raised above it.
[Service]
ExecStartPre=/usr/local/libexec/avena-rs/wait-for-local-nats
TimeoutStartSec=660
