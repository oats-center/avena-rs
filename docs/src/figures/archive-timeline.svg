<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Archiver windows and acknowledgements</title>
  <desc id="d">Messages arrive continuously. Samples from 12:00 to 12:05 go into one file, held in memory. At 12:05 the file is closed, synced and renamed, and only then are its messages acknowledged. If power fails at 12:07, the open file is lost but its messages were never acknowledged, so JetStream delivers them again and they are rewritten.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 13px; font-weight: 600; fill: #1d1d1b; }
    .s { font-size: 12px; fill: #1d1d1b; }
    .l { font-size: 11px; fill: #52514e; }
    .ln { stroke: #52514e; stroke-width: 1.5; fill: none; }
  </style>
  <rect x="0" y="0" width="900" height="380" rx="10" fill="#ffffff"/>

  <text class="l" x="20" y="66">JetStream</text>
  <text class="l" x="20" y="80">messages</text>
  <g stroke="#2a78d6" stroke-width="2"><line x1="130" y1="60" x2="130" y2="82"/><line x1="160" y1="60" x2="160" y2="82"/><line x1="190" y1="60" x2="190" y2="82"/><line x1="220" y1="60" x2="220" y2="82"/><line x1="250" y1="60" x2="250" y2="82"/><line x1="280" y1="60" x2="280" y2="82"/><line x1="310" y1="60" x2="310" y2="82"/><line x1="340" y1="60" x2="340" y2="82"/><line x1="370" y1="60" x2="370" y2="82"/><line x1="400" y1="60" x2="400" y2="82"/><line x1="430" y1="60" x2="430" y2="82"/></g>
  <g stroke="#eb6834" stroke-width="2"><line x1="460" y1="60" x2="460" y2="82"/><line x1="490" y1="60" x2="490" y2="82"/><line x1="520" y1="60" x2="520" y2="82"/><line x1="550" y1="60" x2="550" y2="82"/><line x1="580" y1="60" x2="580" y2="82"/></g>
  <text class="l" x="200" y="50">acknowledged at 12:05</text>
  <text class="l" x="455" y="50">not acknowledged, redelivered</text>

  <text class="l" x="20" y="136">Parquet</text>
  <text class="l" x="20" y="150">files</text>
  <rect x="120" y="120" width="320" height="36" rx="4" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text class="s" x="132" y="143">part-0091: 12:00 to 12:05, held in memory</text>
  <rect x="440" y="120" width="150" height="36" rx="4" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="s" x="452" y="143">12:05 to …</text>

  <line x1="120" y1="100" x2="120" y2="215" stroke="#8a8984" stroke-dasharray="3 3"/>
  <line x1="440" y1="100" x2="440" y2="215" stroke="#8a8984" stroke-dasharray="3 3"/>
  <line x1="760" y1="100" x2="760" y2="215" stroke="#8a8984" stroke-dasharray="3 3"/>
  <line class="ln" x1="80" y1="215" x2="860" y2="215" marker-end="url(#a)"/>
  <text class="l" x="120" y="233" text-anchor="middle">12:00:00</text>
  <text class="l" x="440" y="233" text-anchor="middle">12:05:00</text>
  <text class="l" x="760" y="233" text-anchor="middle">12:10:00</text>
  <text class="l" x="860" y="233" text-anchor="end">sample time</text>

  <line class="ln" x1="440" y1="160" x2="440" y2="180"/>
  <text class="t" x="448" y="178">1. close, fsync, rename</text>
  <text class="t" x="448" y="196">2. ack the messages from 12:00 to 12:05</text>

  <line x1="596" y1="96" x2="596" y2="160" stroke="#c0392b" stroke-width="2.5"/>
  <text class="t" x="604" y="112" style="fill:#c0392b">power cut at 12:07</text>

  <text class="s" x="20" y="275">Nothing from 12:00 to 12:05 can be lost: those messages are acknowledged only after the file is on disk.</text>
  <text class="s" x="20" y="297">The file for 12:05 onward was never written, and its messages were never acknowledged. After a restart,</text>
  <text class="s" x="20" y="319">JetStream delivers them again once the consumer's ack_wait has passed (about 18 minutes with five-minute</text>
  <text class="s" x="20" y="341">windows), and the archiver writes them into a new file for the same window.</text>
</svg>
