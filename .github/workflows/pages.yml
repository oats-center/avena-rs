name: Deploy documentation site

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "docs-site/**"
      - "rust-ljm/**"
      - "schematics/README.md"
      - "scripts/build-docs-site.*"
      - "webapp/README.md"
      - "webapp/package.json"
      - "webapp/pnpm-lock.yaml"
      - "webapp/pnpm-workspace.yaml"
      - "webapp/src/lib/**"
      - "webapp/typedoc.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          package_json_file: webapp/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Install webapp dependencies
        run: pnpm install --frozen-lockfile
        working-directory: webapp

      - name: Build docs site
        run: ./scripts/build-docs-site.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload documentation site
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/docs-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
